# Hyperscheduler level: three nodes, each with 2 GPUs and 16 cores, from one offer.
version: 9999
resources:
  - type: site
    count: 1
    with:
      - type: provider
        count: 1
        with:
          - type: region
            count: 1
            with:
              - type: offer
                count: 1
                with:
                  - type: node
                    count: 3
                    with:
                      - type: slot
                        count: 1
                        label: default
                        with:
                          - type: gpu
                            count: 2
                          - type: core
                            count: 16
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
