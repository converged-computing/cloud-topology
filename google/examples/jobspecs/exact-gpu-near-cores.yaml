# Secretary level: two nodes in one zone, each with a GPU and 4 cores on the same socket.
# The test series has no compact placement, so each node is its own placement group;
# the jobspec asks for two groups of one node rather than one group of two.
version: 9999
resources:
  - type: site
    count: 1
    with:
      - type: provider
        count: 1
        with:
          - type: region
            count: 1
            with:
              - type: zone
                count: 1
                with:
                  - type: offer
                    count: 1
                    with:
                      - type: placement
                        count: 2
                        with:
                          - type: node
                            count: 1
                            with:
                              - type: slot
                                count: 1
                                label: default
                                with:
                                  - type: socket
                                    count: 1
                                    with:
                                      - type: core
                                        count: 4
                                      - type: gpu
                                        count: 1
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
