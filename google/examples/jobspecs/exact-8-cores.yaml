# Secretary level: two nodes in one compact placement group, each with 8 vCPUs: four
# cores of two threads, which is what an exact-graph core is. N2 supports compact
# placement, so an offer's nodes share one group.
version: 9999
resources:
  - type: site
    count: 1
    with:
      - type: provider
        count: 1
        with:
          - type: region
            count: 1
            with:
              - type: zone
                count: 1
                with:
                  - type: offer
                    count: 1
                    with:
                      - type: placement
                        count: 1
                        with:
                          - type: node
                            count: 2
                            with:
                              - type: slot
                                count: 1
                                label: default
                                with:
                                  - type: socket
                                    count: 1
                                    with:
                                      - type: core
                                        count: 4
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
