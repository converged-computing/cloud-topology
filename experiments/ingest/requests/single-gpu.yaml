# One node with one GPU of any kind and a little local disk, for development.
version: 9999
resources:
- type: node
  count: 1
  with:
  - type: slot
    count: 1
    label: default
    with:
    - {type: core, count: 4}
    - {type: gpu, count: 1}
    - {type: memory, count: 16}
    - {type: local_ssd, count: 1}
attributes:
  system:
    duration: 3600
    job: {name: single-gpu}
    requires:
      models: [on-demand]
tasks:
- command: [app]
  slot: default
  count: {per_slot: 1}
