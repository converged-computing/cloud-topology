# One node with two terabytes of memory and fast block storage, on demand.
version: 9999
resources:
- type: node
  count: 1
  with:
  - type: slot
    count: 1
    label: default
    with:
    - {type: core, count: 32}
    - {type: memory, count: 2048}
- {type: pd_ssd, count: 4000}
- {type: hyperdisk_balanced, count: 4000}
- {type: ebs_gp3, count: 4000}
- {type: ebs_io2, count: 4000}
attributes:
  system:
    duration: 3600
    job: {name: big-memory}
    requires:
      models: [on-demand]
tasks:
- command: [app]
  slot: default
  count: {per_slot: 1}
